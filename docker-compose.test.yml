# Postgres dedicado a testes de integração (porta 5434).
# Ex.: docker compose -f docker-compose.test.yml up -d
# export TEST_DATABASE_URL=postgresql://transito:transito@127.0.0.1:5434/transito_sus
# uv run pytest tests/test_postgres_contract.py -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transito
      POSTGRES_PASSWORD: transito
      POSTGRES_DB: transito_sus
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transito -d transito_sus"]
      interval: 5s
      timeout: 5s
      retries: 5
