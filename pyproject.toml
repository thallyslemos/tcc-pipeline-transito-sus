[project]
name = "pipeline-acidentes-transito-sus"
version = "0.1.0"
description = "Pipeline analítico de acidentes de trânsito no SUS — TCC em Sistemas de Informação"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysus>=0.14",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastmcp>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
