[project]
name = "pipeline-acidentes-transito-sus"
version = "0.1.0"
description = "Pipeline analítico de acidentes de trânsito no SUS — TCC em Sistemas de Informação"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysus>=0.14",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastmcp>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "python-dotenv>=1.0",
    "timesfm>=1.2",
    "huggingface-hub>=0.25",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["data-pipeline", "backend", "mcp-server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B", "SIM", "RUF"]
ignore = ["S608", "S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"data-pipeline/sample_data.py" = ["S311"]
"notebooks/**" = ["E501", "F541", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
